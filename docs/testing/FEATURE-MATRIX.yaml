    dependencies: [SM8735, pinned llama.cpp b11849 Snapdragon artifact, pinned Qwen3 0.6B Q4_0 model]
    validation_status: PARTIAL
    qualification: WORKLOAD_VERIFIED
    evidence: [NPU-ACCELERATION.md, ../evidence/2026-10-24-native-acceleration-live-check.md, ../evidence/2026-10-24-p12-ternux-htp-path-review.md, ../evidence/2026-10-24-p12-htp-runtime-integrity-followup.md, ../evidence/2026-10-24-p12-complete-offload-gate.md, ../../lib/npu_inference.py, ../../tests/test_npu_inference.py, ../../tests/test_management_service.py]
    release_qualified: false
    limitations: ["Ternuxx installs only selected files from the SHA-256-pinned MIT release into private HOME state and injects a fixed child-process loader/DSP environment without copying system/vendor libraries. SM8735-only experimental HTP inference passes repeated short known-answer runs with full layer offload and clean cancellation/restart, but is slower than CPU on tested prompts; sustained thermals, memory pressure, broader model/operator correctness, and clean-device runtime acquisition remain unqualified. CPU fallback is disabled."]
    next_action: Complete controlled repeated CPU/HTP correctness, memory, and thermal qualification; retain explicit experimental labeling unless performance and stability evidence supports broader use.
    owner_decision_required: false
