name: P12 Mesa build provenance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p12-mesa-build-provenance
  cancel-in-progress: false

jobs:
  mesa-aarch64:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout Ternuxx audit tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned Termux package recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfdevs/termux-packages
          ref: 0219ff84b372c9d38aad4e40f448c20ec3d1588e
          path: termux-packages
          persist-credentials: false

      - name: Verify and instrument the pinned Mesa recipe
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p termux-packages/p12-mesa-evidence
          python3 tools/p12_mesa_build_evidence.py instrument \
            --recipe termux-packages/packages/mesa/build.sh
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from datetime import datetime, timezone

          checkout = Path("termux-packages")
          recipe = checkout / "packages/mesa/build.sh"
          original = subprocess.check_output(
              ["git", "-C", str(checkout), "show", "HEAD:packages/mesa/build.sh"])
          metadata = {
              "schema_version": 1,
              "captured_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "ternuxx_commit": os.environ["GITHUB_SHA"],
              "workflow_run": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "termux_packages_repository": "https://github.com/lfdevs/termux-packages",
              "termux_packages_commit": subprocess.check_output(
                  ["git", "-C", str(checkout), "rev-parse", "HEAD"], text=True).strip(),
              "mesa_source_commit": "98f3d6229d61452cef80f8563af7c56ae599dc14",
              "mesa_recipe_sha256": hashlib.sha256(original).hexdigest(),
              "instrumented_recipe_sha256": hashlib.sha256(recipe.read_bytes()).hexdigest(),
              "builder_image": "ghcr.io/termux/package-builder@sha256:e2de051a518d8b188c59c4a1ecf357d373b9ccf48d6c06d7681fdc3f61a77287",
              "target_architecture": "aarch64",
              "artifact_policy": "metadata-only; built Debian archives are not uploaded",
          }
          (checkout / "p12-mesa-evidence/build-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Build Mesa with pinned builder image and capture configured graphs
        working-directory: termux-packages
        env:
          TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux/package-builder@sha256:e2de051a518d8b188c59c4a1ecf357d373b9ccf48d6c06d7681fdc3f61a77287
          CONTAINER_NAME: termux-p12-mesa-provenance
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: --env TERNUXX_MESA_BUILD_CAPTURE=1 --env TERNUXX_MESA_EVIDENCE_DIR=/home/builder/p12-mesa-evidence
        run: |
          set -euo pipefail
          docker pull "$TERMUX_BUILDER_IMAGE_NAME"
          docker image inspect --format '{{.Id}} {{join .RepoDigests " "}}' "$TERMUX_BUILDER_IMAGE_NAME" \
            | tee p12-mesa-evidence/builder-image.txt
          set +e
          ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 mesa
          build_status=$?
          set -e
          if docker cp "$CONTAINER_NAME:/home/builder/p12-mesa-evidence/." p12-mesa-evidence/; then
            echo "Copied builder-home capture to the workflow artifact directory."
          elif [ "$build_status" -eq 0 ]; then
            echo "Mesa build passed but its evidence capture directory was not available." >&2
            exit 1
          else
            echo "No builder-home evidence directory was available after the failed build." >&2
          fi
          exit "$build_status"

      - name: Hash package staging outputs and validate capture
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 tools/p12_mesa_build_evidence.py package-manifests \
            --packages-dir termux-packages/output \
            --output-dir termux-packages/p12-mesa-evidence \
            --expected-packages mesa mesa-dev mesa-opencl-icd-rusticl mesa-vulkan-icd-freedreno mesa-vulkan-icd-swrast
          test -s termux-packages/p12-mesa-evidence/aarch64/host/meson-targets.json
          test -s termux-packages/p12-mesa-evidence/aarch64/host/ninja-commands.txt
          test -s termux-packages/p12-mesa-evidence/aarch64/target/meson-targets.json
          test -s termux-packages/p12-mesa-evidence/aarch64/target/ninja-commands.txt
          python3 -m tools.mesa_build_source_audit \
            --targets termux-packages/p12-mesa-evidence/aarch64/target/meson-targets.json \
            --inventory docs/evidence/data/2026-10-24-p12-mesa-source-license-inventory.json \
            --source-root /home/builder/.termux-build/mesa/src \
            --output termux-packages/p12-mesa-evidence/configured-target-source-map.json
          python3 tools/p12_mesa_build_evidence.py validate-capture \
            --evidence-dir termux-packages/p12-mesa-evidence

      - name: Upload metadata-only build evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: p12-mesa-build-evidence-${{ github.run_id }}
          path: termux-packages/p12-mesa-evidence/
          if-no-files-found: warn
          retention-days: 30
