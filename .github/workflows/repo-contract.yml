name: Repository State Contract

on:
  pull_request:
    branches: [main]

# Push events are handled by repo-knowledge-sync.yml so the full suite runs
# once per event. This workflow reports PR validation; merge enforcement is
# controlled separately by GitHub branch protection or repository rulesets.

permissions:
  contents: read

jobs:
  state-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install state-tool dependency
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Validate CLI shell syntax and help contract
        run: |
          bash -n bin/tx lib/help.sh lib/ssh.sh tests/test_cli_help.sh
          bash tests/test_cli_help.sh
      - name: Run repository unit and mock integration tests
        run: bash scripts/repo_test.sh
      - name: Validate deterministic state
        run: python3 -m tools.repo_knowledge verify
      - name: Validate README knowledge bridge
        run: python3 tools/doc_bridge.py check --strict --project-id ternuxx README.md
      - name: Validate repository classification
        run: |
          python3 - <<'PY'
          import yaml
          from scripts.repository_types import is_valid_type
          with open("PROJECT_CLASSIFICATION.yaml", encoding="utf-8") as stream:
              value = yaml.safe_load(stream)["classification"]["primary"]
          if not is_valid_type(value):
              raise SystemExit(f"Unsupported repository type: {value!r}")
          print(f"Repository type: {value}")
          PY
      - name: Validate required project documents
        run: |
          test -f AI_ASSISTANT.md
          test -f CURRENT_STATE.md
          test -f PROJECT_MANIFEST.yaml
          test -f PROJECT_CLASSIFICATION.yaml
          test -f SECURITY.md
          test -f SKB_KNOWLEDGE_SYNC.md
