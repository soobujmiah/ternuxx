name: P12 reproducible Snapdragon HTP runtime candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p12-htp-reproducible-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Independent build ${{ matrix.attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android@sha256:e39e5e9c0957550a92c0de756b7556d81196c7c7f7328ed80de252bfb4878adf
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - name: Checkout Ternuxx packaging and policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch and verify pinned upstream source
        env:
          LLAMA_SOURCE_COMMIT: 0ae0e1976670fac25f4e0ed864df30021accc764
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C upstream fetch --depth=1 origin refs/tags/b11849:refs/tags/b11849
          test "$(git -C upstream rev-parse 'b11849^{commit}')" = "$LLAMA_SOURCE_COMMIT"
          git -C upstream checkout --detach "$LLAMA_SOURCE_COMMIT"
          git -C upstream submodule update --init --recursive
          git -C upstream submodule status --recursive | tee submodules.txt
          if grep -Eq '^[+-U]' submodules.txt; then
            echo 'A submodule is not at the commit pinned by the llama.cpp source tree.' >&2
            exit 1
          fi
          mkdir -p build-output
          git -C upstream show -s --format='%ct' "$LLAMA_SOURCE_COMMIT" > source-date-epoch.txt
          git -C upstream show -s --format='%H%n%T%n%P%n%s' "$LLAMA_SOURCE_COMMIT" > source-commit.txt
          cp submodules.txt build-output/submodules.txt
          cp source-commit.txt build-output/source-commit.txt
          cp source-date-epoch.txt build-output/source-date-epoch.txt

      - name: Generate pinned-source SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: upstream
          format: spdx-json
          output-file: build-output/upstream-source.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Build pinned Android ARM64 CPU, OpenCL and HTP runtime
        env:
          SOURCE_DATE_EPOCH_FILE: source-date-epoch.txt
          ZERO_AR_DATE: "1"
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(cat "$SOURCE_DATE_EPOCH_FILE")"
          cp upstream/docs/backend/snapdragon/CMakeUserPresets.json upstream/CMakeUserPresets.json
          cd upstream
          cmake --preset arm64-android-snapdragon-release -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN;$ORIGIN/../lib' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF
          cmake --build build -j "$(nproc)"
          cmake --install build --prefix "$GITHUB_WORKSPACE/build-output/install"
          cd "$GITHUB_WORKSPACE"
          {
            printf 'cmake: '; cmake --version | head -n 1
            printf 'ninja: '; ninja --version
            printf 'clang: '; clang --version | head -n 1
            printf 'android_ndk_revision: '
            sed -n 's/^Pkg.Revision = //p' "$ANDROID_NDK_ROOT/source.properties"
            printf 'android_ndk_root: %s\n' "$ANDROID_NDK_ROOT"
            printf 'hexagon_sdk_root: %s\n' "$HEXAGON_SDK_ROOT"
          } > build-output/toolchain-versions.txt
          sha256sum upstream/docs/backend/snapdragon/CMakeUserPresets.json \
            > build-output/cmake-user-preset.sha256
          sha256sum tools/package_snapdragon_release.py > build-output/packager.sha256
          cp upstream/LICENSE build-output/install/LICENSE
          python3 tools/collect_snapdragon_notices.py \
            --source-dir upstream \
            --output build-output/install/THIRD_PARTY_NOTICES.txt
          cp upstream/LICENSE build-output/upstream-LICENSE.txt

      - name: Package and verify deterministic install archive
        env:
          LLAMA_SOURCE_COMMIT: 0ae0e1976670fac25f4e0ed864df30021accc764
          BUILDER_IMAGE: ghcr.io/snapdragon-toolchain/arm64-android@sha256:e39e5e9c0957550a92c0de756b7556d81196c7c7f7328ed80de252bfb4878adf
          TERNUXX_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 tools/package_snapdragon_release.py package \
            --install-prefix build-output/install \
            --output-dir build-output \
            --source-tag b11849 \
            --source-commit "$LLAMA_SOURCE_COMMIT" \
            --source-epoch "$(cat source-date-epoch.txt)" \
            --builder-image "$BUILDER_IMAGE" \
            --packager-sha256 "$(cut -d ' ' -f1 build-output/packager.sha256)" \
            --workflow-commit "$TERNUXX_WORKFLOW_COMMIT"
          archive="build-output/llama-b11849-bin-android-arm64-snapdragon.tar.gz"
          manifest="build-output/manifest.json"
          python3 tools/package_snapdragon_release.py verify --archive "$archive" --manifest "$manifest"
          mkdir -p sbom-root
          tar -xzf "$archive" -C sbom-root
          rm -rf build-output/install

      - name: Generate packaged-runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: sbom-root/llama-b11849
          format: spdx-json
          output-file: build-output/runtime.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Bind runtime SPDX files to the verified package manifest
        run: |
          python3 tools/package_snapdragon_release.py normalize-runtime-spdx \
            --manifest build-output/manifest.json \
            --spdx build-output/runtime.spdx.json

      - name: Upload independent build output for verification
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: p12-htp-build-attempt-${{ matrix.attempt }}
          path: build-output/
          if-no-files-found: error
          retention-days: 10

  verify:
    if: github.ref == 'refs/heads/main'
    name: Compare independent builds and retain candidate
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Ternuxx package verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build attempt one
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p12-htp-build-attempt-1
          path: attempts/1

      - name: Download build attempt two
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p12-htp-build-attempt-2
          path: attempts/2

      - name: Verify package integrity and build reproducibility
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            python3 tools/package_snapdragon_release.py verify \
              --archive "attempts/$attempt/llama-b11849-bin-android-arm64-snapdragon.tar.gz" \
              --manifest "attempts/$attempt/manifest.json"
          done
          first="$(cut -d ' ' -f1 attempts/1/SHA256SUMS)"
          second="$(cut -d ' ' -f1 attempts/2/SHA256SUMS)"
          test "$first" = "$second"
          mkdir -p candidate
          cp attempts/1/llama-b11849-bin-android-arm64-snapdragon.tar.gz \
             attempts/1/SHA256SUMS attempts/1/manifest.json \
             attempts/1/upstream-source.spdx.json attempts/1/runtime.spdx.json \
             attempts/1/toolchain-versions.txt attempts/1/cmake-user-preset.sha256 \
             attempts/1/packager.sha256 attempts/1/submodules.txt attempts/1/upstream-LICENSE.txt \
             candidate/
          python3 - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('attempts/1/manifest.json').read_text())
          second=json.loads(Path('attempts/2/manifest.json').read_text())
          for field in (
            'source_tag', 'source_commit', 'source_date_epoch',
            'ternuxx_workflow_commit', 'build_system', 'build_flags',
            'builder_image', 'packager_sha256', 'runtime_files',
          ):
            if first[field] != second[field]:
              raise SystemExit(f'independent build metadata differs: {field}')
          record={
            'schema_version':1,
            'status':'two independent clean builds produced byte-identical package archives',
            'workflow_run_id':__import__('os').environ['GITHUB_RUN_ID'],
            'ternuxx_workflow_commit':__import__('os').environ['GITHUB_SHA'],
            'source_commit':first['source_commit'],
            'builder_image':first['builder_image'],
            'artifact_sha256_attempt_1':first['artifact_sha256'],
            'artifact_sha256_attempt_2':second['artifact_sha256'],
            'identical':first['artifact_sha256']==second['artifact_sha256'],
            'license_and_device_release_gates_closed':False,
            'publication':'not published; internal Actions candidate only',
          }
          if not record['identical']:
            raise SystemExit('independent package archives differ')
          Path('candidate/reproducibility-verification.json').write_text(
            json.dumps(record,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          (
            cd candidate
            sha256sum \
              llama-b11849-bin-android-arm64-snapdragon.tar.gz \
              SHA256SUMS manifest.json upstream-source.spdx.json runtime.spdx.json \
              toolchain-versions.txt cmake-user-preset.sha256 packager.sha256 \
              submodules.txt upstream-LICENSE.txt reproducibility-verification.json \
              > CANDIDATE.SHA256SUMS
          )
          python3 tools/package_snapdragon_release.py verify-candidate \
            --candidate-dir candidate

      - name: Upload verified internal candidate (not a release)
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: ternuxx-p12-htp-reproducible-candidate-${{ github.run_id }}
          path: candidate/
          if-no-files-found: error
          retention-days: 90
