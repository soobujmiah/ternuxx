name: Repository Knowledge Sync

# This workflow writes deterministic status only to this repository.
# SKB pulls registered project state; this workflow has no SKB token or dispatch credential.
on:
  push:
    branches: [main]
    paths-ignore: ['.repo/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    outputs:
      test_status: ${{ steps.tests.outputs.status }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python -m pip install --quiet -r requirements-dev.txt
      - run: python3 -m tools.repo_knowledge verify
      - run: python3 tools/doc_bridge.py check --strict --project-id ternuxx README.md
      - name: Run repository tests
        id: tests
        run: |
          if env -u LD_LIBRARY_PATH bash scripts/repo_test.sh; then
            echo 'status=passed' >> "$GITHUB_OUTPUT"
          else
            echo 'status=failed' >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python -m pip install --quiet -r requirements-dev.txt
      - name: Record honest build/test state
        run: |
          python3 -m tools.repo_knowledge sync --ci \
            --build-status unknown \
            --build-run-id "${GITHUB_RUN_ID}" \
            --test-status "${{ needs.validate.outputs.test_status }}" \
            --test-run-id "${GITHUB_RUN_ID}" \
            --workflow-name "${GITHUB_WORKFLOW}" \
            --event-type "${GITHUB_EVENT_NAME}" \
            --actor "${GITHUB_ACTOR}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Validate generated state
        run: python3 -m tools.repo_knowledge verify
      - name: Commit state to this repository
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .repo
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(repo-knowledge): sync deterministic state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Fail workflow when repository tests fail
        if: needs.validate.outputs.test_status == 'failed'
        run: exit 1
